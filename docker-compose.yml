# ============================================================
# Zuqi Backend — Local Development Infrastructure
# ============================================================
# PostgreSQL is on AWS RDS (sifadevdb.cpv9gzf8h14i.eu-west-1.rds.amazonaws.com).
# This file provides the remaining local services:
#   - Redis       (caching, session management)
#   - Prometheus  (scrapes /api/actuator/prometheus from the Spring Boot app)
#   - Grafana     (dashboard UI on http://localhost:3001)
#
# Usage:
#   docker compose up -d              # start all services
#   docker compose down               # stop all services
#   docker compose logs -f prometheus # tail Prometheus logs
#   docker compose logs -f grafana    # tail Grafana logs
#
# Grafana:    http://localhost:3001   (admin / admin — change on first login)
# Prometheus: http://localhost:9090
# ============================================================

services:

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: zuqi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD:-zuqi_redis_dev}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-zuqi_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ─────────────────────────────────────────────
  # Scrapes the Spring Boot app every 15 s.
  # Spring Boot must be running on the host at port 8080.
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: zuqi-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    extra_hosts:
      # Allows Prometheus inside Docker to reach the Spring Boot app on the host
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Grafana ────────────────────────────────────────────────
  # Dashboard UI. Auto-provisions Prometheus data source and LLM dashboard.
  # Default credentials: admin / admin  (prompted to change on first login)
  # Access at: http://localhost:3001
  grafana:
    image: grafana/grafana:10.4.2
    container_name: zuqi-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"          # 3000 is used by the React frontend
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
