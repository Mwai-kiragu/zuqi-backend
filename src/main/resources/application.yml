    # username: ${DB_USERNAME:zuqi}
    # password: ${DB_PASSWORD:zuqi}
    url: jdbc:postgresql://sifadevdb.cpv9gzf8h14i.eu-west-1.rds.amazonaws.com:5432/zuqi_test
    username: postgres
