    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA Configuration be
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # Flyway Migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false
    cache-names:
      # Feature caches (Phase 1 — original 9 models)
      - merchantFeatures
      - merchantPaymentTrends
      - paymentFeatures
      - demandFeatures
      - inventoryFeatures
      - salesRepFeatures
      - aiModels
      # Feature caches (Phase 2 — new models)
      - reorderFeatures
      - expiryFeatures
      - reconFeatures
      - cashFlowFeatures
      - customerAnalyticsFeatures
      - supplierFeatures
      - pricingFeatures
      # Infrastructure caches
      - distanceMatrix

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:zuqi-secret-key-change-in-production-this-must-be-at-least-256-bits}
  access-token-expiration: 900000  # 15 minutes
  refresh-token-expiration: 604800000  # 7 days

# Casbin Authorization Configuration
casbin:
  model-path: casbin/model.conf
  use-database: true  # Use database-backed policies (casbin_rule table)

# LangChain4j Configuration
langchain4j:
  # RBS AI — primary LLM provider (OpenAI-compatible, vLLM-backed)
  rbs-ai:
    base-url: https://rbsai.rbrc.io
    api-key: ${RBS_AI_API_KEY:not-configured}
    chat-model:
      model-name: qwen3-14b
      temperature: 0.1  # Low for consistency in credit scoring
      timeout: 180s
    report-model:
      model-name: qwen3-14b
      temperature: 0.2  # Slightly higher for narrative report prose
      timeout: 300s     # 5-min timeout — report generation

# Zuqi AI Configuration
zuqi:
  ai:
    credit-scoring:
      mode: HYBRID  # Options: LLM_ONLY, ML_ONLY, HYBRID
      hybrid-weights:
        ml: 0.7   # ML primary (synthetic-trained XGBoost)
        llm: 0.3  # LLM validation (deep reasoning for edge cases)
      flag-discrepancy-threshold: 15  # Flag if ML vs LLM difference > 15 points
      llm-validation-triggers:
        high-value-limit: 500000  # KES - Always validate if limit > 500k
        low-ml-confidence: 0.6    # Validate if ML confidence < 0.6
        new-category-validation: true  # Validate new merchant categories
        sample-rate: 0.3          # Random validation sample (30%)
      retraining-enabled: true   # Enable weekly model retraining with real outcomes
      retraining-cron: "0 0 2 ? * SUN"  # Every Sunday at 2:00 AM

    demand-forecasting:
      enabled: true
      forecast-horizon-days: 7  # Predict 1 week ahead
      xgboost:
        num-rounds: 150  # Boosting rounds (higher = more capacity, slower training)
      min-confidence-threshold: 0.5  # Filter suggestions with confidence < 0.5
      max-suggestions-per-merchant: 20  # Limit order suggestions
      llm-enrichment-enabled: false  # Phase 5+ feature (sales tips from LLM)
      training-enabled: true   # Enable weekly model training
      training-cron: "0 0 2 ? * SUN"  # Every Sunday at 2:00 AM (before forecast job at 3:00 AM)
      forecast-schedule: "0 0 3 * * *"  # Every day at 3:00 AM

    anomaly-detection:
      training-enabled: true             # Enable weekly anomaly model retraining
      shrinkage-training-cron: "0 0 2 ? * SUN"
      payment-training-cron: "0 30 2 ? * SUN"
      shrinkage-threshold: 0.5
      payment-anomaly-threshold: 0.5

    prediction:
      training-enabled: true             # Enable weekly prediction model retraining
      stockout-training-cron: "0 0 3 ? * SUN"
      rep-training-cron: "0 30 3 ? * SUN"
      stockout-alert-threshold: 0.5
      rep-performance-alert-threshold: 60.0

    routing:
      enabled: true                      # Enable nightly route optimization job
      optimization-cron: "0 0 18 * * *"  # 6 PM daily

    agent:
      enabled: true                           # Enable weekly recommendation job
      recommendation-cron: "0 0 8 ? * MON"   # Every Monday at 08:00

    reporting:
      compliance-cron: "0 0 4 1 * *"         # 1st of every month at 04:00

    credit:
      adjustment-enabled: true                # Enable monthly credit limit adjustments
      adjustment-cron: "0 0 1 1 * *"         # 1st of every month at 01:00
      max-increase-pct: 20.0
      min-limit-kes: 50000.0

    monitoring:
      drift-detection-enabled: true           # Enable weekly drift detection
      drift-check-cron: "0 0 6 ? * SUN"
      performance-tracking-cron: "0 0 5 * * *"
      psi-threshold: 0.2
      reference-window-days: 90
      current-window-days: 14

    # Phase 2: K-Means clustering
    kmeans:
      clusters: 5
      iterations: 100

    # Phase 2: Inventory AI
    inventory:
      reorder-enabled: true
      reorder-cron: "0 0 5 * * *"        # Daily 5 AM
      expiry-enabled: true
      expiry-cron: "0 30 5 * * *"        # Daily 5:30 AM
      auto-po-enabled: false             # Only in REAL data phase
      auto-po-cron: "0 0 6 * * *"        # Daily 6 AM

    # Phase 2: Financial AI
    financial:
      recon-enabled: true
      recon-auto-match-threshold: 0.95   # Auto-match above this probability
      recon-suggest-threshold: 0.50      # Suggest to user above this
      cashflow-enabled: true
      cashflow-cron: "0 0 4 * * *"       # Daily 4 AM
      cashflow-horizons: [7, 30, 90]     # Forecast horizons in days

    # Phase 2: CRM AI
    crm:
      segmentation-enabled: true
      segmentation-cron: "0 0 3 ? * MON"  # Weekly Monday 3 AM
      health-score-enabled: true
      health-score-cron: "0 30 3 ? * MON"
      clv-enabled: true
      clv-cron: "0 0 2 1 * *"             # Monthly 1st 2 AM
      churn-enabled: true
      churn-cron: "0 0 4 ? * MON"         # Weekly Monday 4 AM
      churn-alert-threshold: 0.65          # Alert if churn probability >= 65%
      product-recommendations-enabled: true
      product-recommendations-cron: "0 0 5 ? * MON"
      visit-optimization-enabled: true
      visit-cron: "0 30 5 ? * MON"

    # Phase 2: Procurement AI
    procurement:
      supplier-risk-enabled: true
      supplier-risk-cron: "0 0 2 1 * *"   # Monthly 1st 2 AM
      price-trends-enabled: true
      price-trends-cron: "0 30 2 1 * *"   # Monthly 1st 2:30 AM
      order-qty-enabled: true

    # Phase 2: Pricing AI
    pricing:
      enabled: true
      pricing-cron: "0 0 6 ? * MON"       # Weekly Monday 6 AM

# Timefold Solver Configuration
timefold:
  solver:
    termination:
      spent-limit: 120s                  # Max 2 minutes per distributor per solve

